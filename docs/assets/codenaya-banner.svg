  <text x="457" y="218" fill="#a24415" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3">AI APP BUILDER · AGENTIC CLOUD IDE</text>
