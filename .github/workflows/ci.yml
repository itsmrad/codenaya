name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Playwright e2e (`npm run test:e2e`) is intentionally not run here: it needs a
# live Convex deployment, the Clerk test-user pool and other real secrets.
# Run it locally (see the README e2e section).

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Non-secret placeholders: `next build` prerenders pages that create
          # the Convex and Clerk clients at module load. Nothing is called.
          NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
          # pk_test_ + base64("example.clerk.accounts.dev$")
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
